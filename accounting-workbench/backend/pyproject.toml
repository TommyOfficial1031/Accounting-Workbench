[project]
name = "accounting-backend"
version = "0.1.0"
description = "Accounting workbench Python sidecar backend"
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pandas",
    "numpy",
    "openpyxl",
    "xlrd==1.2.0",
    "chardet",
    "pyarrow",
    "pydantic",
    "matplotlib",
    "pypdf",
    "pillow",
    "xlwt",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["accounting_backend*"]