[package]
name = "accounting-workbench"
version = "0.1.0"
description = "Accounting workbench desktop shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 启动前查 WebView2 运行时是否已安装（startup.rs）。只在 Windows 上编译。
[target.'cfg(windows)'.dependencies]
winreg = "0.56"
