name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pyinstaller pytest httpx

      - name: Backend tests
        shell: bash
        working-directory: backend
        run: python -m pytest tests -q

      - name: Install frontend dependencies
        run: npm ci

      - name: Build sidecar (PyInstaller onedir)
        run: python backend/build.py

      - name: Build frontend
        run: npm run build

      - name: Bundle (Tauri)
        run: npm run tauri build

      - name: Package Windows installer (NSIS)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          New-Item -ItemType Directory -Force -Path dist-installer | Out-Null
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /V2 installer\windows\workbench.nsi

      - name: Upload Windows installer
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: dist-installer/*.exe

      - name: Upload macOS dmg
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: src-tauri/target/release/bundle/dmg/*.dmg
